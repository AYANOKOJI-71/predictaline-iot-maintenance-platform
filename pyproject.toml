[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "predictaline-iot-maintenance"
version = "0.1.0"
description = "A safe local IoT predictive-maintenance portfolio demonstration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.9,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
where = ["apps/api/src"]
